<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="./output.css" rel="stylesheet">
</head>

<body class="bg-gray-900 flex justify-center items-center min-h-screen">
    <div class="w-full max-w-sm bg-gray-700 p-6 rounded-md">
        <h1 class="text-3xl text-white block text-center mb-4">Login</h1>
        <form action="#">
            <div>
                <label for="email" class="text-gray-400 block mb-2 focus:border-blue-600">Email</label>
                <input type="email" id="email" class="w-full bg-gray-500 p-3 mb-4 rounded-md text-white focus:outline-none focus:ring-2 focus:ring-blue-400" placeholder="Email">
            </div>
            <div>
                <label for="password" class="text-gray-400 block mb-2">Password</label>
                <input type="password" id="password" id="email" class="w-full bg-gray-500 p-3 mb-4 rounded-md text-white focus:outline-none focus:ring-2 focus:ring-blue-400" placeholder="Password">
            </div>
            <button type="submit" class="w-full bg-blue-600 py-3 text-white rounded-md mt-2 mb-3 hover:bg-blue-700 cursor-pointer">Login</button>
        </form>
    </div>
</body>

</html>
